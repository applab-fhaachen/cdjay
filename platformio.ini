; PlatformIO Project Configuration for CDJay Pioneer CDJ-850 Bridge

[platformio]
default_envs = pico2_alejandro

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
build_flags = 
    -DUSE_TINYUSB
build_src_filter = +<*.cpp> -<main2.cpp>
lib_deps = 
    adafruit/Adafruit TinyUSB Library
    fortyseveneffects/MIDI Library
monitor_speed = 115200

; Raspberry Pi Pico 2 W (RP2350) - Runs original standalone test (main.cpp)
[env:pico2]
board = rpipico2w
build_src_filter = +<*.cpp> -<main2.cpp>

; Raspberry Pi Pico 2 W with Alejandro SPI Protocol Decoder (main2.cpp)
[env:pico2_alejandro]
board = rpipico2w
build_src_filter = +<*.cpp> -<main.cpp>

; Raspberry Pi Pico 1 (RP2040)
[env:pico]
board = pico
